<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts (non-blocking) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" />
    
    <!-- Preload hero image for mobile LCP -->
    <link rel="preload" as="image" type="image/webp" href="/hero-bg-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
    
    <!-- Primary Meta Tags -->
    <title>Ministério Extraordinário | Luciano Faé</title>
    <meta name="title" content="Ministério Extraordinário | Luciano Faé" />
    <meta name="description" content="Uma trilha completa de formação espiritual para quem decidiu que não vai mais viver abaixo do seu chamado. Mentoria com Pastor Luciano Faé." />
    <meta name="keywords" content="treinamento do guerreiro, luciano faé, mentoria espiritual, chamado, cura, milagres, escola de libertadores, ministério profético" />
    <meta name="author" content="Luciano Faé" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ministério Extraordinário | Luciano Faé" />
    <meta property="og:description" content="Uma trilha completa de formação espiritual para quem decidiu que não vai mais viver abaixo do seu chamado. Mentoria com Pastor Luciano Faé." />
    <meta property="og:url" content="https://umministerioextraordinario.com.br/" />
    <meta property="og:image" content="https://umministerioextraordinario.com.br/social-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ministério Extraordinário | Luciano Faé" />
    <meta name="twitter:description" content="Uma trilha completa de formação espiritual para quem decidiu que não vai mais viver abaixo do seu chamado." />
    <meta name="twitter:image" content="https://umministerioextraordinario.com.br/social-image.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <script>
      // Prevent "Cannot set property fetch" TypeError from polyfills
      if (typeof window !== 'undefined') {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && !desc.set && desc.configurable) {
          Object.defineProperty(window, 'fetch', {
            get: desc.get,
            set: function() { /* ignore */ },
            configurable: true
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
