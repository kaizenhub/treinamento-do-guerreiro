    <script>
      // Prevent "Cannot set property fetch" TypeError from polyfills
      if (typeof window !== 'undefined') {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && !desc.set && desc.configurable) {

            get: desc.get,
            set: function() { /* ignore */ },
            configurable: true
